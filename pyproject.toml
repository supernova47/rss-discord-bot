[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-rss-bot"
version = "0.1.0"
description = "A self-hostable RSS and Atom feed dashboard and Discord bot"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "cryptography>=43,<47",
  "discord.py>=2.6,<3",
  "feedparser>=6,<7",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["rssbot*"]

[tool.setuptools.package-data]
rssbot = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

